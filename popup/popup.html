<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PolyKit</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="pk-header">
    <img class="pk-logo" src="../icons/icon48.png" alt="" width="44" height="44">
    <div class="pk-brand">
      <h1>PolyKit</h1>
      <p>Theme all of PolyWorld</p>
    </div>
    <label class="pk-switch" title="Turn PolyKit on or off">
      <input type="checkbox" id="enabled" aria-label="Enable PolyKit">
      <span class="pk-switch-track"></span>
    </label>
  </header>

  <main class="pk-main">
    <div class="pk-status" id="tabStatus" hidden>
      Open polyworld.games to see changes live.
    </div>

    <section class="pk-section">
      <h2>Appearance</h2>
      <div class="pk-segment" id="modeGroup" role="group" aria-label="Dark mode">
        <button type="button" data-mode="site">Match site</button>
        <button type="button" data-mode="light">Light</button>
        <button type="button" data-mode="dark">Dark</button>
        <button type="button" data-mode="system">Auto</button>
      </div>
    </section>

    <section class="pk-section">
      <h2>Themes</h2>
      <div class="pk-presets" id="presetGrid"></div>
    </section>

    <section class="pk-section">
      <div class="pk-section-head">
        <h2>Colors</h2>
        <button type="button" class="pk-text-btn" id="clearColors">Use theme colors</button>
      </div>
      <div class="pk-colors">
        <div class="pk-color-row">
          <label for="color-accent">Accent</label>
          <div class="pk-color-inputs">
            <input type="color" id="color-accent" aria-label="Accent color">
            <input type="text" id="hex-accent" spellcheck="false" maxlength="7" aria-label="Accent hex color">
          </div>
        </div>
        <div class="pk-color-row">
          <label for="color-background">Background</label>
          <div class="pk-color-inputs">
            <input type="color" id="color-background" aria-label="Background color">
            <input type="text" id="hex-background" spellcheck="false" maxlength="7" aria-label="Background hex color">
          </div>
        </div>
        <div class="pk-color-row">
          <label for="color-panel">Panels</label>
          <div class="pk-color-inputs">
            <input type="color" id="color-panel" aria-label="Panel color">
            <input type="text" id="hex-panel" spellcheck="false" maxlength="7" aria-label="Panel hex color">
          </div>
        </div>
        <div class="pk-color-row">
          <label for="color-text">Text</label>
          <div class="pk-color-inputs">
            <input type="color" id="color-text" aria-label="Text color">
            <input type="text" id="hex-text" spellcheck="false" maxlength="7" aria-label="Text hex color">
          </div>
        </div>
      </div>
    </section>

    <section class="pk-section">
      <h2>Type &amp; layout</h2>
      <div class="pk-field">
        <label for="font">Font</label>
        <select id="font"></select>
      </div>
      <div class="pk-field">
        <div class="pk-field-head">
          <label for="fontScale">Text size</label>
          <output id="fontScaleOut">100%</output>
        </div>
        <input type="range" id="fontScale" min="0.8" max="1.3" step="0.05">
      </div>
      <div class="pk-field">
        <div class="pk-field-head">
          <label for="radius">Corner radius</label>
          <output id="radiusOut">6px</output>
        </div>
        <input type="range" id="radius" min="0" max="24" step="1">
      </div>
      <label class="pk-check" for="compact">
        <input type="checkbox" id="compact">
        <span>Compact navigation</span>
      </label>
      <label class="pk-check" for="reduceEffects">
        <input type="checkbox" id="reduceEffects">
        <span>Reduce seasonal effects</span>
      </label>
    </section>

    <details class="pk-details">
      <summary>Custom CSS <span>Advanced</span></summary>
      <textarea id="customCSS" rows="7" spellcheck="false" placeholder="/* Anything here is injected after PolyWorld's styles. */&#10;.pw-nav { box-shadow: 0 4px 20px rgba(0,0,0,.2); }"></textarea>
      <p>Applied only on polyworld.games. Changes save automatically.</p>
    </details>
  </main>

  <footer class="pk-footer">
    <button type="button" class="pk-text-btn" id="openSite">Open PolyWorld ↗</button>
    <button type="button" class="pk-text-btn" id="resetAll">Reset</button>
    <span id="saveStatus" role="status" aria-live="polite">Ready</span>
  </footer>

  <script src="../shared/presets.js"></script>
  <script src="../shared/theme.js"></script>
  <script src="popup.js"></script>
</body>
</html>
